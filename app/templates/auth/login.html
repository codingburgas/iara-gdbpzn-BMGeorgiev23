{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-danger text-white text-center">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ГДПБЗН" height="100" class="mb-2">
                <h4 class="mb-0">Вход в системата</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Имейл</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="вашият@имейл.com">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Парола</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Въведете парола">
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Вход</button>
                </form>
                <div class="mt-3 text-center">
                    <small class="text-muted">Нямате профил? <a href="{{ url_for('auth.register') }}" class="text-danger">Регистрация</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}
