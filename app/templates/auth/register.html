{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-danger text-white text-center">
                <h4 class="mb-0">Създаване на профил</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Пълно име</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="Вашето име">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Имейл</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="вашият@имейл.com">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Парола</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Минимум 6 символа">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Потвърдете паролата</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Повторете паролата">
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Регистрация</button>
                </form>
                <div class="mt-3 text-center">
                    <small class="text-muted">Вече имате профил? <a href="{{ url_for('auth.login') }}" class="text-danger">Вход</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}
