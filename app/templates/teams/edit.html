{% extends "base.html" %}

{% block title %}Редактиране на екип{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="display-6 fw-bold">Редактиране на екип</h1>
        <hr>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Име на екипа <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ team.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Описание</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ team.description }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="members" class="form-label">Членове на екипа</label>
                        <select class="form-select" id="members" name="members" multiple size="6">
                            {% for user in all_firefighters %}
                                <option value="{{ user.id }}" {% if user.id in current_member_ids %}selected{% endif %}>
                                    {{ user.name }} ({{ user.get_role_display() }}) {% if user.team_id and user.team_id != team.id %} - В друг екип{% endif %}
                                </option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Задръжте Ctrl (или Cmd) за да изберете няколко потребители.</small>
                        <br>
                        <small class="text-muted text-warning">Потребители, които са в друг екип, ще бъдат преместени.</small>
                    </div>
                    
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-save"></i> Запази промените
                    </button>
                    <a href="{{ url_for('teams.detail_team', team_id=team.id) }}" class="btn btn-secondary">Отказ</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
